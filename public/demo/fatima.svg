<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Fatima Al Mansoori">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f0e3"/>
      <stop offset="1" stop-color="#b7e4c7"/>
    </linearGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e7a5f"/>
      <stop offset="1" stop-color="#0a5c48"/>
    </linearGradient>
    <clipPath id="round"><circle cx="64" cy="64" r="64"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="128" height="128" fill="url(#bg)"/>
    <!-- shoulders / dress -->
    <path d="M14 132 C18 100 40 92 64 92 C88 92 110 100 114 132 Z" fill="#f3f7f4"/>
    <!-- hijab outer -->
    <path d="M64 18 C36 18 28 44 30 66 C31 80 40 90 40 104 L88 104 C88 90 97 80 98 66 C100 44 92 18 64 18 Z" fill="url(#scarf)"/>
    <!-- face -->
    <ellipse cx="64" cy="58" rx="19" ry="23" fill="#e8b895"/>
    <!-- hijab inner frame -->
    <path d="M45 58 C45 38 52 30 64 30 C76 30 83 38 83 58 C83 50 76 40 64 40 C52 40 45 50 45 58 Z" fill="#0a5c48"/>
    <!-- eyes -->
    <ellipse cx="56" cy="58" rx="2.2" ry="2.6" fill="#2b1d16"/>
    <ellipse cx="72" cy="58" rx="2.2" ry="2.6" fill="#2b1d16"/>
    <path d="M52 52 q4 -3 8 0" stroke="#2b1d16" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <path d="M68 52 q4 -3 8 0" stroke="#2b1d16" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- nose & smile -->
    <path d="M64 62 q-2 5 1 6" stroke="#c9906d" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <path d="M57 72 q7 6 14 0" stroke="#a5563f" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    <!-- scarf drape -->
    <path d="M40 104 C46 96 50 88 48 76 C52 90 60 96 64 96 C68 96 76 90 80 76 C78 88 82 96 88 104 Z" fill="#0e7a5f"/>
  </g>
</svg>
